name: ComfyMobile
options:
  bundleIdPrefix: kz.colorize
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  ComfyMobile:
    type: application
    platform: iOS
    sources:
      - path: ComfyMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.colorize.comfymobile
        PRODUCT_NAME: ComfyMobile
        INFOPLIST_FILE: ComfyMobile/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
