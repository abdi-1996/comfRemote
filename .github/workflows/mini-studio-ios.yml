name: Build Mini Studio iPhone v1.1
on:
  push:
    branches: [mini-studio-ios-1.1]
    paths:
      - 'MiniStudio-iOS/**'
      - 'MiniStudio-ModelPicker/**'
      - '.github/workflows/mini-studio-ios.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Validate bridges and companion
        working-directory: MiniStudio-iOS
        run: |
          node --test Tests/bridge.test.mjs
          python3 -m py_compile ../MiniStudio-ModelPicker/__init__.py
          xcodegen generate
      - name: Build for iPhone
        working-directory: MiniStudio-iOS
        run: |
          set -o pipefail
          xcodebuild -project MiniStudio.xcodeproj -scheme MiniStudio -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > build.log 2>&1 || { tail -120 build.log; exit 1; }
          tail -15 build.log
      - name: Package unsigned IPA
        working-directory: MiniStudio-iOS
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/MiniStudio.app package/Payload/
          file package/Payload/MiniStudio.app/MiniStudio
          test -f package/Payload/MiniStudio.app/studio-bridge.js
          plutil -lint package/Payload/MiniStudio.app/Info.plist
          cd package
          /usr/bin/zip -qry ../MiniStudio-1.1.0-unsigned.ipa Payload
      - name: Package Windows model picker
        run: |
          /usr/bin/zip -qry MiniStudio-iOS/MiniStudio-ModelPicker.zip MiniStudio-ModelPicker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MiniStudio-iPhone-1.1.0
          path: |
            MiniStudio-iOS/MiniStudio-1.1.0-unsigned.ipa
            MiniStudio-iOS/MiniStudio-ModelPicker.zip
            MiniStudio-iOS/*.log
          if-no-files-found: error
          retention-days: 14
