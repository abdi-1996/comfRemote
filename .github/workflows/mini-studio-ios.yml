name: Build Mini Studio iPhone
on:
  push:
    branches: [mini-studio-ios-1.0]
    paths: ['MiniStudio-iOS/**', '.github/workflows/mini-studio-ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project and test bridge
        working-directory: MiniStudio-iOS
        run: |
          node --test Tests/bridge.test.mjs
          xcodegen generate
      - name: Build for iPhone
        working-directory: MiniStudio-iOS
        run: |
          set -o pipefail
          xcodebuild -project MiniStudio.xcodeproj -scheme MiniStudio -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > build.log 2>&1 || { tail -100 build.log; exit 1; }
          tail -10 build.log
      - name: Package unsigned IPA
        working-directory: MiniStudio-iOS
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/MiniStudio.app package/Payload/
          file package/Payload/MiniStudio.app/MiniStudio
          test -f package/Payload/MiniStudio.app/studio-bridge.js
          plutil -lint package/Payload/MiniStudio.app/Info.plist
          cd package
          /usr/bin/zip -qry ../MiniStudio-1.0.0-unsigned.ipa Payload
      - name: Build for simulator
        working-directory: MiniStudio-iOS
        run: |
          xcodebuild -project MiniStudio.xcodeproj -scheme MiniStudio -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath simulator CODE_SIGNING_ALLOWED=NO build > simulator.log 2>&1 || { tail -80 simulator.log; exit 1; }
      - name: Launch and capture iPhone screen
        working-directory: MiniStudio-iOS
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" simulator/Build/Products/Debug-iphonesimulator/MiniStudio.app
          xcrun simctl launch "$DEVICE" com.abdi.ministudio
          sleep 5
          xcrun simctl io "$DEVICE" screenshot MiniStudio-iPhone.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MiniStudio-iPhone-1.0.0
          path: |
            MiniStudio-iOS/*.ipa
            MiniStudio-iOS/MiniStudio-iPhone.png
            MiniStudio-iOS/*.log
          if-no-files-found: error
          retention-days: 14
